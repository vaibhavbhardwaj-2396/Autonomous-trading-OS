name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      # Live state is deliberately gitignored. Tests need the documented,
      # non-secret bootstrap state, so create it only inside this disposable
      # GitHub runner.
      - name: Create test state
        run: cp memory/state.json.template memory/state.json

      # Test modules are executable scripts that report their own summary and
      # call sys.exit(), so unittest discovery cannot import them safely.
      - name: Run test modules
        run: |
          for test_file in tests/test_*.py; do
            echo "::group::$test_file"
            python "$test_file"
            echo "::endgroup::"
          done
